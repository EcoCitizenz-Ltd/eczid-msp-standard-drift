name: "ECZ-ID MSP Standard Drift"
description: "Compare a customer repository's current machine-trust projection with an MSP-approved baseline without making a universal trust or compliance verdict."
author: EcoCitizenz Ltd
branding:
  icon: shield
  color: green
inputs:
  path:
    description: "Repository-relative path to inspect."
    required: false
    default: "."
  client-id:
    description: "Optional MSP/customer identifier included in the proposed/current projection."
    required: false
  baseline:
    description: "Repository-relative path to the approved baseline JSON."
    required: false
    default: ".eczid/msp-baseline.json"
  output:
    description: "Repository-relative path for the drift report or proposed baseline."
    required: false
    default: "eczid-msp-standard-drift.json"
  mode:
    description: "check or propose. Propose emits a baseline proposal but never commits it."
    required: false
    default: "check"
  fail-on:
    description: "invalid or never. Drift does not fail by default."
    required: false
    default: "invalid"
outputs:
  result-state:
    description: "NO_CHANGE, CHANGED, BASELINE_PROPOSED, or INVALID_INPUT."
    value: ${{ steps.delegate.outputs['result-state'] }}
  current-hash:
    description: "SHA-256 hash of the current normalized projection."
    value: ${{ steps.delegate.outputs['current-hash'] }}
  expected-hash:
    description: "SHA-256 hash of the approved baseline projection when present."
    value: ${{ steps.delegate.outputs['expected-hash'] }}
  changed-field-count:
    description: "Number of top-level projection fields that differ."
    value: ${{ steps.delegate.outputs['changed-field-count'] }}
  report-path:
    description: "Path to the generated drift report or proposed baseline."
    value: ${{ steps.delegate.outputs['report-path'] }}
  next-action-url:
    description: "One contextual next step when drift is observed."
    value: ${{ steps.delegate.outputs['next-action-url'] }}
runs:
  using: composite
  steps:
    - id: delegate
      uses: EcoCitizenz-Ltd/eczid-msp-machine-trust-toolkit/actions/standard-drift@fedb5cb7633e7cf74c952291a7fbe302e5333af6
      with:
        path: ${{ inputs['path'] }}
        client-id: ${{ inputs['client-id'] }}
        baseline: ${{ inputs['baseline'] }}
        output: ${{ inputs['output'] }}
        mode: ${{ inputs['mode'] }}
        fail-on: ${{ inputs['fail-on'] }}
